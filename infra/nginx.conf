# The gateway is bound to localhost. The host nginx terminates HTTPS and sets
# X-Forwarded-Proto; direct local requests fall back to their actual scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Only the bot service may reach the contact-verification endpoint.
    location ^~ /api/bot/ {
        return 404;
    }

    # 1. Django API
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 65s;
        proxy_pass http://backend:8000;
    }

    # 2. Django admin panel
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 65s;
        proxy_pass http://backend:8000;
    }

    # 3. Staff photos are served through authenticated /api/files/ requests.
    location /media/ {
        return 404;
    }

    # 4. Django static files (admin, DRF, and custom report assets)
    location /static/ {
        alias /app/staticfiles/;
    }

    # 5. React frontend and build assets
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-cache';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
