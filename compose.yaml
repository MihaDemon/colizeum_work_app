name: colizeum-work

services:
  # 0. PostgreSQL database
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-colizeum}
      POSTGRES_USER: ${POSTGRES_USER:-colizeum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  # 1. Django backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DJANGO_DEBUG: 'False'
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-colizeum}
      POSTGRES_USER: ${POSTGRES_USER:-colizeum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_STATIC_ROOT: /app/staticfiles
      DJANGO_MEDIA_ROOT: /app/media
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
    expose:
      - '8000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health/", timeout=4)']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true

  # Run migrations, collect admin assets, and optionally create the initial owner.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ['init']
    restart: 'no'
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DJANGO_DEBUG: 'False'
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-colizeum}
      POSTGRES_USER: ${POSTGRES_USER:-colizeum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_STATIC_ROOT: /app/staticfiles
      DJANGO_MEDIA_ROOT: /app/media
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    init: true

  # Deliver the durable queue of task completion notifications.
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '1'
    command: ['python', 'manage.py', 'dispatch_notifications', '--loop']
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DJANGO_DEBUG: 'False'
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-colizeum}
      POSTGRES_USER: ${POSTGRES_USER:-colizeum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_MEDIA_ROOT: /app/media
    volumes:
      - django_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    init: true

  # 2. Build React and publish it to the shared frontend volume.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: 'no'
    volumes:
      - frontend_build:/usr/share/nginx/html

  # 3. Telegram bot
  telegram_bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      BACKEND_URL: http://backend:8000
      BOT_SERVICE_TOKEN: ${BOT_SERVICE_TOKEN:?Set BOT_SERVICE_TOKEN in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      WEBAPP_URL: ${WEBAPP_URL:?Set WEBAPP_URL to your public HTTPS domain}
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    init: true

  # 4. Internal gateway for the host nginx reverse proxy
  infra:
    image: nginx:1.28-alpine
    restart: always
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8000}:80'
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
      - django_static:/app/staticfiles:ro
      - django_media:/app/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/nginx-health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  django_static:
  django_media:
  postgres_data:
  frontend_build:
